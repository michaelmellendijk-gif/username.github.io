<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn Vandaag</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f8;
margin:0;
padding:15px;
}

.header{
background:#2563eb;
color:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
text-align:center;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
}

.task{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #eee;
}

.done{
text-decoration:line-through;
opacity:0.5;
}

.progress{
height:12px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
background:#22c55e;
width:0%;
}
</style>
</head>
<body>

<div class="header">
<h1>🏠 Mijn Vandaag</h1>
<p>Dagtaken eenvoudig bijhouden</p>
</div>

<div class="card">
<input id="newTask" placeholder="Nieuwe taak...">
<button onclick="addTask()">Toevoegen</button>
</div>

<div class="card">
<h3>Voortgang</h3>
<p id="stats">0 van 0 klaar</p>
<div class="progress">
<div class="bar" id="bar"></div>
</div>
</div>

<div class="card">
<h3>Mijn Taken</h3>
<div id="list"></div>
</div>

<script>

let tasks=JSON.parse(localStorage.getItem("tasks"))||[];

function save(){
localStorage.setItem("tasks",JSON.stringify(tasks));
render();
}

function addTask(){
let text=document.getElementById("newTask").value;

if(text==="") return;

tasks.push({text:text,done:false});

document.getElementById("newTask").value="";
save();
}

function toggle(i){
tasks[i].done=!tasks[i].done;
save();
}

function removeTask(i){
tasks.splice(i,1);
save();
}

function render(){

let list=document.getElementById("list");
list.innerHTML="";

let done=0;

tasks.forEach((task,i)=>{

if(task.done) done++;

list.innerHTML+=`
<div class="task">
<span class="${task.done?'done':''}"
onclick="toggle(${i})">
${task.text}
</span>

<button style="width:auto;padding:8px 12px;background:red"
onclick="removeTask(${i})">
✕
</button>

</div>
`;
});

document.getElementById("stats").innerText=
done+" van "+tasks.length+" klaar";

let percent=tasks.length
? (done/tasks.length)*100
: 0;

document.getElementById("bar").style.width=
percent+"%";
}

render();

</script>

</body>
</html>
